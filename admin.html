<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atlas Store — Админ Панель</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; -webkit-tap-highlight-color: transparent; }
    .glass-panel {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    input, select, textarea {
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #f97316; /* Акцентный оранжевый */
    }
    /* Скрытие скролла */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-orange-500 selection:text-white">

  <!-- ЭКРАН ВХОДА -->
  <div id="loginView" class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="glass-panel p-8 rounded-[2rem] w-full max-w-sm text-center shadow-2xl shadow-orange-500/10">
      <div class="w-16 h-16 rounded-full bg-orange-500/20 text-orange-500 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h1 class="text-2xl font-black tracking-tight mb-2">Вход в систему</h1>
      <p class="text-gray-400 text-sm mb-6">Введите PIN-код для доступа к базе данных Atlas Store.</p>
      
      <input type="password" id="pinInput" placeholder="••••" class="w-full text-center text-3xl tracking-[1em] font-black py-4 rounded-2xl mb-4" inputmode="numeric">
      
      <button onclick="login()" class="w-full bg-orange-500 hover:bg-orange-600 text-black font-black py-4 rounded-2xl transition-colors active:scale-95">
        Войти
      </button>
      <p id="loginError" class="text-red-500 text-sm mt-3 hidden font-bold">Неверный PIN-код!</p>
    </div>
  </div>

  <!-- ОСНОВНАЯ АДМИНКА -->
  <div id="adminView" class="hidden flex-col h-screen">
    <!-- Шапка -->
    <header class="glass-panel sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center text-black font-black text-xl">A</div>
        <div>
          <h1 class="font-black text-lg leading-none">ATLAS ADMIN</h1>
          <span class="text-[10px] text-orange-500 font-bold uppercase tracking-widest">Live Database</span>
        </div>
      </div>
      <button onclick="logout()" class="p-2 bg-white/5 rounded-full text-gray-400 hover:text-white active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </header>

    <!-- Навигация -->
    <div class="flex p-4 gap-2 border-b border-white/10 shrink-0">
      <button onclick="switchTab('products')" id="tab-products" class="flex-1 py-2.5 rounded-xl font-bold text-sm bg-white text-black transition">📦 Товары</button>
      <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-2.5 rounded-xl font-bold text-sm bg-white/10 text-gray-400 transition">🧾 Заказы</button>
    </div>

    <!-- Вью: Товары -->
    <div id="view-products" class="p-4 overflow-y-auto flex-1 pb-24">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-black">Каталог товаров</h2>
        <button onclick="openProductModal()" class="bg-orange-500 text-black px-4 py-2 rounded-xl font-black text-sm active:scale-95">+ Добавить</button>
      </div>
      
      <div id="productsList" class="space-y-3">
        <div class="text-center text-gray-500 py-10 animate-pulse">Загрузка товаров...</div>
      </div>
    </div>

    <!-- Вью: Заказы -->
    <div id="view-orders" class="hidden p-4 overflow-y-auto flex-1 pb-24">
      <h2 class="text-xl font-black mb-4">История заказов</h2>
      <div id="ordersList" class="space-y-3">
        <div class="text-center text-gray-500 py-10">Заказы пока не подключены к БД</div>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ТОВАР -->
  <div id="productModal" class="fixed inset-0 z-50 hidden justify-end bg-black/80 backdrop-blur-sm">
    <div class="glass-panel w-full h-[90vh] mt-auto rounded-t-[2rem] flex flex-col transform transition-transform translate-y-full" id="productModalContent">
      <div class="flex items-center justify-between p-5 border-b border-white/10">
        <h3 id="modalTitle" class="text-lg font-black">Новый товар</h3>
        <button onclick="closeProductModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:scale-95">✕</button>
      </div>
      
      <div class="p-5 overflow-y-auto flex-1 space-y-4">
        <input type="hidden" id="p_id">
        
        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">Название товара</label>
          <input type="text" id="p_title" class="w-full px-4 py-3 rounded-xl text-sm" placeholder="Например: Шапка Corteiz">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Категория</label>
            <select id="p_category" class="w-full px-4 py-3 rounded-xl text-sm">
              <option value="clothes">Одежда (clothes)</option>
              <option value="beanies">Шапки (beanies)</option>
              <option value="accessories">Аксессуары (accessories)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Статус наличия</label>
            <select id="p_availability" class="w-full px-4 py-3 rounded-xl text-sm border-orange-500/50">
              <option value="instock">🟢 В наличии</option>
              <option value="transit">🟠 В пути</option>
              <option value="preorder">🔵 Предзаказ</option>
              <option value="exclusive">🟡 Эксклюзив</option>
              <option value="out_of_stock">🔴 Нет в наличии</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Цена (₸)</label>
            <input type="number" id="p_price" class="w-full px-4 py-3 rounded-xl text-sm" placeholder="0">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Старая цена (зачеркнутая)</label>
            <input type="number" id="p_oldPrice" class="w-full px-4 py-3 rounded-xl text-sm" placeholder="0">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">Краткое описание</label>
          <textarea id="p_desc" class="w-full px-4 py-3 rounded-xl text-sm h-20" placeholder="Описание товара..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">ID Фото из Google Drive</label>
          <input type="text" id="p_driveId" class="w-full px-4 py-3 rounded-xl text-sm font-mono text-orange-400" placeholder="Например: 1v1B-c5nQ71M...">
          <p class="text-[10px] text-gray-500 mt-1">Вставьте ID ссылки на фото.</p>
        </div>

        <div class="p-4 bg-white/5 rounded-xl border border-white/10 space-y-3">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm font-bold">В эксклюзивную коллекцию (верх)</span>
            <input type="checkbox" id="p_inDrop" class="w-5 h-5 rounded accent-orange-500">
          </label>
          <hr class="border-white/10">
          <label class="flex items-center justify-between cursor-pointer text-red-400">
            <span class="text-sm font-bold">Скрыть товар с витрины</span>
            <input type="checkbox" id="p_hidden" class="w-5 h-5 rounded accent-red-500">
          </label>
        </div>
      </div>

      <div class="p-5 border-t border-white/10 bg-[#111111]">
        <button onclick="saveProduct()" id="saveBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-black font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all">
          Сохранить товар
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://atlas-api.turlanmanas.workers.dev";
    let adminPin = localStorage.getItem('atlas_admin_pin') || '';
    let products = [];

    // --- АВТОРИЗАЦИЯ ---
    if (adminPin) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('adminView').classList.remove('hidden');
      document.getElementById('adminView').classList.add('flex');
      fetchProducts();
    }

    async function login() {
      const pin = document.getElementById('pinInput').value;
      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = "Проверка...";
      
      try {
        const res = await fetch(`${API_URL}/api/auth`, {
          method: 'POST',
          headers: { 'X-Admin-Pin': pin }
        });
        
        if (res.ok) {
          adminPin = pin;
          localStorage.setItem('atlas_admin_pin', pin);
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('adminView').classList.remove('hidden');
          document.getElementById('adminView').classList.add('flex');
          fetchProducts();
        } else {
          document.getElementById('loginError').classList.remove('hidden');
        }
      } catch (err) {
        alert("Ошибка сети");
      } finally {
        btn.textContent = originalText;
      }
    }

    function logout() {
      adminPin = '';
      localStorage.removeItem('atlas_admin_pin');
      window.location.reload();
    }

    // --- НАВИГАЦИЯ ---
    function switchTab(tab) {
      document.getElementById('view-products').classList.add('hidden');
      document.getElementById('view-orders').classList.add('hidden');
      document.getElementById('tab-products').className = 'flex-1 py-2.5 rounded-xl font-bold text-sm bg-white/10 text-gray-400 transition';
      document.getElementById('tab-orders').className = 'flex-1 py-2.5 rounded-xl font-bold text-sm bg-white/10 text-gray-400 transition';
      
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-2.5 rounded-xl font-bold text-sm bg-white text-black transition shadow-lg';

      if(tab === 'orders') fetchOrders();
    }

    // --- ТОВАРЫ ---
    async function fetchProducts() {
      try {
        const res = await fetch(`${API_URL}/api/products`);
        products = await res.json();
        renderProducts();
      } catch (err) {
        document.getElementById('productsList').innerHTML = `<div class="text-red-500 text-center py-5">Ошибка загрузки</div>`;
      }
    }

    function renderProducts() {
      const list = document.getElementById('productsList');
      if (!products.length) {
        list.innerHTML = `<div class="text-center text-gray-500 py-10">База данных пуста</div>`;
        return;
      }

      list.innerHTML = products.map(p => {
        const img = p.driveId ? `https://lh3.googleusercontent.com/d/${p.driveId}=w200` : (p.imgUrl || 'https://placehold.co/100x100/222/fff?text=IMG');
        const badge = p.inDrop ? `<span class="px-2 py-0.5 bg-orange-500/20 text-orange-400 text-[10px] font-black rounded uppercase tracking-wide">В дропе</span>` : '';
        const hiddenBadge = p.hidden ? `<span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-[10px] font-black rounded uppercase tracking-wide">Скрыт</span>` : '';
        
        let availColor = "text-green-400";
        if (p.availability === 'out_of_stock') availColor = "text-red-500";
        if (p.availability === 'transit') availColor = "text-orange-400";
        if (p.availability === 'preorder') availColor = "text-blue-400";
        if (p.availability === 'exclusive') availColor = "text-yellow-400";

        return `
          <div class="glass-panel p-3 rounded-2xl flex gap-3 items-center border ${p.hidden ? 'border-red-500/30 opacity-60' : 'border-white/10'}">
            <img src="${img}" class="w-16 h-16 rounded-xl object-cover bg-[#111]" />
            <div class="flex-1 min-w-0">
              <div class="flex gap-1 mb-1">${badge} ${hiddenBadge}</div>
              <h4 class="font-black text-sm truncate">${p.title.ru || 'Без названия'}</h4>
              <p class="font-bold ${availColor} text-xs mt-0.5 flex gap-2 items-center">
                <span>${p.price} ₸</span>
                <span class="opacity-70 text-[10px] uppercase tracking-wider">${p.availability || 'instock'}</span>
              </p>
            </div>
            <div class="flex flex-col gap-1.5 shrink-0">
              <button onclick="editProduct(${p.id})" class="p-2 bg-white/10 rounded-lg active:scale-90">✏️</button>
              <button onclick="deleteProduct(${p.id})" class="p-2 bg-red-500/10 text-red-400 rounded-lg active:scale-90">🗑</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- МОДАЛКА ТОВАРА ---
    function openProductModal() {
      document.getElementById('productModal').classList.remove('hidden');
      document.getElementById('productModal').classList.add('flex');
      setTimeout(() => document.getElementById('productModalContent').classList.remove('translate-y-full'), 10);
      
      // Очистка формы
      document.getElementById('modalTitle').textContent = "Новый товар";
      document.getElementById('p_id').value = "";
      document.getElementById('p_title').value = "";
      document.getElementById('p_category').value = "clothes";
      document.getElementById('p_availability').value = "instock";
      document.getElementById('p_price').value = "";
      document.getElementById('p_oldPrice').value = "";
      document.getElementById('p_desc').value = "";
      document.getElementById('p_driveId').value = "";
      document.getElementById('p_inDrop').checked = false;
      document.getElementById('p_hidden').checked = false;
    }

    function closeProductModal() {
      document.getElementById('productModalContent').classList.add('translate-y-full');
      setTimeout(() => {
        document.getElementById('productModal').classList.add('hidden');
        document.getElementById('productModal').classList.remove('flex');
      }, 300);
    }

    function editProduct(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      openProductModal();
      document.getElementById('modalTitle').textContent = "Редактировать товар";
      document.getElementById('p_id').value = p.id;
      document.getElementById('p_title').value = p.title.ru || "";
      document.getElementById('p_category').value = p.category || "clothes";
      document.getElementById('p_availability').value = p.availability || "instock";
      document.getElementById('p_price').value = p.price || "";
      document.getElementById('p_oldPrice').value = p.oldPrice || "";
      document.getElementById('p_desc').value = p.shortDesc.ru || "";
      document.getElementById('p_driveId').value = p.driveId || "";
      document.getElementById('p_inDrop').checked = !!p.inDrop;
      document.getElementById('p_hidden').checked = !!p.hidden;
    }

    async function saveProduct() {
      const btn = document.getElementById('saveBtn');
      btn.textContent = "Сохранение...";
      
      const id = document.getElementById('p_id').value;
      const isNew = !id;
      
      const driveIdStr = document.getElementById('p_driveId').value.trim();
      const imgUrlGen = driveIdStr ? `https://lh3.googleusercontent.com/d/${driveIdStr}=w1600` : "";

      const payload = {
        id: isNew ? Date.now() : Number(id),
        category: document.getElementById('p_category').value,
        availability: document.getElementById('p_availability').value,
        inDrop: document.getElementById('p_inDrop').checked,
        hidden: document.getElementById('p_hidden').checked,
        price: Number(document.getElementById('p_price').value),
        oldPrice: Number(document.getElementById('p_oldPrice').value) || 0,
        driveId: driveIdStr,
        imgUrl: imgUrlGen,
        title: { ru: document.getElementById('p_title').value, kz: "" },
        shortDesc: { ru: document.getElementById('p_desc').value, kz: "" },
        badges: ["ATLAS"],
        colors: { ru: [], kz: [] },
        colorStock: [true],
        specs: { ru: [], kz: [] }
      };

      try {
        const method = isNew ? 'POST' : 'PUT';
        const endpoint = isNew ? `${API_URL}/api/products` : `${API_URL}/api/products/${id}`;
        
        const res = await fetch(endpoint, {
          method,
          headers: { 
            'Content-Type': 'application/json',
            'X-Admin-Pin': adminPin 
          },
          body: JSON.stringify(isNew ? [payload] : payload) // POST ожидает массив (из старого кода), PUT - объект
        });

        if (res.ok) {
          closeProductModal();
          fetchProducts();
        } else {
          alert("Ошибка при сохранении. Проверьте права доступа.");
        }
      } catch (err) {
        alert("Ошибка сети");
      } finally {
        btn.textContent = "Сохранить товар";
      }
    }

    async function deleteProduct(id) {
      if (!confirm("Точно удалить товар?")) return;
      try {
        const res = await fetch(`${API_URL}/api/products/${id}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Pin': adminPin }
        });
        if (res.ok) fetchProducts();
        else alert("Ошибка удаления");
      } catch (err) {
        alert("Ошибка сети");
      }
    }

    // --- ЗАКАЗЫ (НОВАЯ ЛОГИКА) ---
    async function fetchOrders() {
      const list = document.getElementById('ordersList');
      list.innerHTML = `<div class="text-center text-gray-500 py-10 animate-pulse">Синхронизация заказов...</div>`;
      try {
        const res = await fetch(`${API_URL}/api/orders`);
        const orders = await res.json();
        
        if (!orders || orders.length === 0) {
          list.innerHTML = `<div class="text-center text-gray-500 py-10">Пока нет заказов</div>`;
          return;
        }

        list.innerHTML = orders.map(o => `
          <div class="glass-panel p-4 rounded-2xl border border-white/10 mb-3 relative">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="bg-orange-500 text-black font-black text-[10px] px-2 py-1 rounded uppercase tracking-wider">${o.trackCode || 'НЕТ КОДА'}</span>
                <div class="text-xs text-gray-400 mt-1">${new Date(o.createdAt).toLocaleString('ru-RU')}</div>
              </div>
              <div class="text-right">
                <div class="text-lg font-black text-white">${o.total} ₸</div>
                <div class="text-[11px] text-gray-400 font-bold">${o.customerName || 'Клиент'}</div>
              </div>
            </div>
            
            <div class="bg-[#111] p-3 rounded-xl border border-white/5 my-3">
              <p class="text-[11px] text-gray-400 leading-relaxed">${o.itemsSummary}</p>
            </div>
            
            <div class="text-xs text-orange-400 font-bold mb-3 flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              ${o.address || 'Адрес не указан'}
            </div>

            <div class="flex gap-2">
              <button onclick="deleteOrder('${o.trackCode}')" class="flex-1 bg-red-500/10 text-red-500 font-bold py-2 rounded-xl text-xs active:scale-95 transition-transform">Удалить</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="text-red-500 text-center py-5 font-bold">Ошибка сети при загрузке заказов</div>`;
      }
    }

    async function deleteOrder(trackCode) {
      if (!confirm(`Удалить заказ ${trackCode}?`)) return;
      try {
        const res = await fetch(`${API_URL}/api/orders/${encodeURIComponent(trackCode)}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Pin': adminPin }
        });
        if (res.ok) fetchOrders();
        else alert("Не удалось удалить заказ");
      } catch (err) {
        alert("Ошибка сети");
      }
    }
  </script>
</body>
</html>

            border: 1.5px solid transparent;
        }
        .btn-luxury {
            position: relative;
            overflow: hidden;

        }
        .btn-luxury:active { transform: scale(0.96); }
        .ripple-wave {
            position: absolute;
            border-radius: 9999px;
            transform: scale(0);
            animation: rippleExpand 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            background: rgba(168, 85, 247, 0.28);
            pointer-events: none;
        }
        @keyframes rippleExpand {
            to { transform: scale(3.2); opacity: 0; }
        }
        .header-scrolled {
            background-color: rgba(9, 9, 11, 0.96) !important;
            box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.85);
            border-bottom-color: rgba(168, 85, 247, 0.35) !important;
        }
        .nav-link-underline { position: relative; }
        .nav-link-underline::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 4px;
            height: 1.5px;
            background: linear-gradient(90deg, #A855F7, #FACC15);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .nav-link-underline:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
        .footer-link-anim {
            position: relative;
            display: inline-flex;
            align-items: center;
            transition: color 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-link-anim:hover {
            transform: translateX(4px);
            color: #FFFFFF;
        }
        .product-card-img-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background-color: #18181C;
        }
        .product-img-primary,
        .product-img-secondary {
            transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @media (hover: hover) {
            .product-card:hover .product-img-primary { transform: scale(1.05); }
            .product-card:hover .product-img-secondary { opacity: 1; transform: scale(1.05); }
        }
        @keyframes fadeUpBlurLuxury {
            from { opacity: 0; transform: translateY(18px); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .hero-stagger { opacity: 0; animation: fadeUpBlurLuxury 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .hero-word { display: inline-block; opacity: 0; animation: fadeUpBlurLuxury 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-180 { animation-delay: 0.18s; }
        .delay-260 { animation-delay: 0.26s; }
        .delay-340 { animation-delay: 0.34s; }
        .delay-400 { animation-delay: 0.42s; }
        @keyframes ambientOrbDrift {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-14px, 10px, 0) scale(1.04); }
        }
        .hero-orb-slow { animation: ambientOrbDrift 12s ease-in-out infinite; }
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(4px);
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal-on-scroll.is-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
        .view-section { transition: opacity 0.3s ease; }
        .view-hidden { display: none; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
        .accordion-content.open { max-height: 260px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media (max-width: 640px) {
            input, select, textarea { font-size: 16px !important; }
            button, a[role="button"] { min-height: 44px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .hero-stagger, .hero-word, .reveal-on-scroll {
                opacity: 1 !important;
                transform: none !important;
                filter: none !important;
            }
        }
